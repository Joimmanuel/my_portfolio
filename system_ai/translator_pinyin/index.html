<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator Pinyin dengan Gemini AI</title>
    <style>
        /* CSS Variables untuk tema warna */
        :root {
            --primary-color: #6366f1; /* Warna ungu/biru modern untuk AI */
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-bg: #fee2e2;
            --danger-text: #ef4444;
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Card */
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 1.75rem;
            color: var(--primary-color);
            margin-bottom: 24px;
            font-weight: 700;
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="password"],
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background-color: #f9fafb;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.5;
        }

        /* Buttons */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1; /* Membuat tombol AI mengisi sisa ruang */
        }

        button:first-child {
            background-color: var(--primary-color);
            color: white;
            flex: 2;
        }

        button:first-child:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-clear {
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .btn-clear:hover {
            background-color: #fecaca;
        }

        /* Output Area */
        .output-group {
            background-color: #f1f5f9;
            border: 1px dashed #cbd5e1;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .output-group:empty::before {
            content: "Hasil terjemahan akan muncul di sini...";
            color: var(--text-muted);
            font-style: italic;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Translator Pinyin - Indo</h1>
        
        <div class="converter-box">
			<!--
            <div class="input-group">
                <label for="apiKey">API Key Gemini:</label>
                <input type="password" id="apiKey" placeholder="Paste API Key Gemini kamu di sini..." class="api-input">
            </div>-->

            <div class="input-group">
                <label for="inputText">Teks (Pinyin / Indo):</label>
                <textarea id="inputText"></textarea>
            </div>

            <div class="controls">
                <button onclick="processTranslationWithGemini()">Terjemahkan dengan AI</button>
                <button onclick="clearAll()" class="btn-clear">Hapus</button>
            </div>

            <div class="output-group" id="outputArea"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
